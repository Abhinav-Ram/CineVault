
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Is this movie "movie night" friendly?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'cine-black': '#0a0a0a',
              'cine-dark': '#121212',
              'cine-gray': '#2a2a2a',
              'cine-accent': '#e50914', // Netflix-ish red
              'cine-gold': '#f5c518', // IMDb gold
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      @font-face {
        font-family: 'Bradley Hand';
        src: local('Bradley Hand'), local('BradleyHandITCTT-Bold');
        font-weight: bold;
      }
      body {
        background-color: #FFD700;
        color: #000000;
        font-family: 'Times New Roman', Times, serif;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #FFD700; 
      }
      ::-webkit-scrollbar-thumb {
        background: #000; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #333; 
      }

      .font-handwriting {
        font-family: 'Bradley Hand', 'cursive';
        font-weight: bold;
      }

      input, textarea {
        font-family: 'Bradley Hand', 'cursive' !important;
        font-weight: bold !important;
        background-color: white !important;
        border: 2px solid black !important;
        color: black !important;
        padding: 4px 12px !important;
        font-size: 1.4rem !important;
      }

      .no-print {
        display: block;
      }
      .print-only {
        display: none;
      }

      /* LaTeX-Grade Styles for PDF generation */
      .pdf-template {
        background: white !important;
        color: #1a1a1a !important;
        padding: 50px 70px !important;
        font-family: "Times New Roman", Times, Baskerville, Georgia, serif !important;
        width: 700px; /* Optimal reading width for A4 */
        line-height: 1.5 !important;
        text-align: justify !important;
      }
      .pdf-template * {
        color: #1a1a1a !important;
        background-color: transparent !important;
        border-color: #333 !important;
      }
      .pdf-template h1 {
        font-size: 26pt !important;
        text-align: center !important;
        margin-bottom: 5pt !important;
        border-bottom: 3pt double #333 !important;
        text-transform: uppercase !important;
        letter-spacing: 2pt !important;
      }
      .pdf-template h2 {
        font-size: 18pt !important;
        border-bottom: 1.5pt solid #333 !important;
        margin-top: 25pt !important;
        margin-bottom: 10pt !important;
        font-variant: small-caps !important;
      }
      .pdf-template h3 {
        font-size: 13pt !important;
        font-weight: bold !important;
        margin-top: 15pt !important;
        margin-bottom: 5pt !important;
        font-style: italic !important;
      }
      .pdf-template .section-num {
        font-weight: bold !important;
        margin-right: 10pt !important;
      }
      .pdf-template .watermark {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(-45deg);
        font-size: 70pt;
        opacity: 0.05;
        color: black;
        pointer-events: none;
        z-index: 0;
        font-weight: bold;
        white-space: nowrap;
      }
      .pdf-template .metadata-block {
        font-size: 10pt !important;
        border: 1pt solid #ccc !important;
        padding: 10pt !important;
        background-color: #fdfdfd !important;
        margin-bottom: 20pt !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0"
  }
}
</script>
